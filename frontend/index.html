<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Resume Builder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>ATS-Friendly Resume Builder</h1>
    <form id="resumeForm">
        <label>Name:</label><br>
        <input type="text" id="name" required><br><br>

        <label>Degree:</label><br>
        <input type="text" id="degree" required><br><br>

        <label>Institution:</label><br>
        <input type="text" id="institution" required><br><br>

        <label>Year of Passing:</label><br>
        <input type="text" id="year" required><br><br>

        <label>Skills (comma separated):</label><br>
        <input type="text" id="skills" required><br><br>

        <label>Training Title:</label><br>
        <input type="text" id="training_title"><br>
        <label>From:</label><br>
        <input type="text" id="training_from"><br>
        <label>To:</label><br>
        <input type="text" id="training_to"><br><br>

        <label>Project Name:</label><br>
        <input type="text" id="project_name"><br>
        <label>Project Description:</label><br>
        <input type="text" id="project_desc"><br><br>

        <button type="submit">Download Resume</button>
    </form>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
